# =============================================================================
# dashboards.yml - Grafana Dashboard Provisioning (PFA)
# =============================================================================
apiVersion: 1
providers:
  - name: PFA
    orgId: 1
    folder: PFA
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
