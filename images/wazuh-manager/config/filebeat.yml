output.elasticsearch:
  hosts: ["10.0.3.11:9200"]
  protocol: https
  username: admin
  password: PFA_Admin_2026
  ssl.verification_mode: none
setup.template.json.enabled: true
setup.template.json.path: '/etc/filebeat/wazuh-template.json'
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat.log
  keepfiles: 7
filebeat.modules:
  - module: wazuh
    alerts:
      enabled: true
    archives:
      enabled: true
