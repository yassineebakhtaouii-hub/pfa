<?xml version="1.0" encoding="UTF-8"?>
<!-- =========================================================================
     ossec.conf - Wazuh Manager Configuration (PFA)
     ========================================================================= -->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>yes</logall>
    <logall_json>yes</logall_json>
    <email_notification>no</email_notification>
  </global>

  <rules>
    <include>rules_config.xml</include>
    <include>custom_rules.xml</include>
    <include>decoder.xml</include>
    <include>custom_decoders.xml</include>
  </rules>

  <syscheck>
    <disabled>no</disabled>
    <frequency>7200</frequency>
  </syscheck>

  <remote>
    <connection>syslog</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <allowed-ips>10.0.0.0/8</allowed-ips>
    <local_ip>10.0.3.10</local_ip>
  </remote>

  <remote>
    <connection>secure</connection>
    <port>1515</port>
    <protocol>tcp</protocol>
    <allowed-ips>10.0.0.0/8</allowed-ips>
    <local_ip>10.0.3.10</local_ip>
  </remote>

  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <force_insert>yes</force_insert>
    <purge>yes</purge>
    <use_password>no</use_password>
    <limit_maxagents>yes</limit_maxagents>
    <max_agents>50</max_agents>
  </auth>

  <cluster>
    <disabled>yes</disabled>
  </cluster>

  <sca>
    <disabled>no</disabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_afected>yes</skip_afected>
  </sca>

  <vulnerability-detector>
    <disabled>no</disabled>
    <interval>1d</interval>
    <run_on_start>yes</run_on_start>
    <provider name="canonical" os="ubuntu-focal">
      <enabled>yes</enabled>
      <update_interval>1d</update_interval>
    </provider>
  </vulnerability-detector>

  <command>
    <name>custom-suricata-alert</name>
    <executable>collect_logs.py</executable>
    <expect>srcip</expect>
    <timeout_allowed>no</timeout_allowed>
  </command>
</ossec_config>
