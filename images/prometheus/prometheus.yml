# =============================================================================
# prometheus.yml - Prometheus Configuration (PFA)
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "suricata-exporter"
    static_configs:
      - targets: ["10.0.1.100:9091"]
        labels:
          segment: "dmz"
          role: "ids"

  - job_name: "wazuh-indexer"
    metrics_path: "/_cat/health"
    static_configs:
      - targets: ["10.0.3.11:9200"]
        labels:
          segment: "monitoring"
          role: "siem-storage"

  - job_name: "prometheus-self"
    static_configs:
      - targets: ["localhost:9090"]
