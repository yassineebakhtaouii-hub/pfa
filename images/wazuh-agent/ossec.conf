<?xml version="1.0" encoding="UTF-8"?>
<!-- =========================================================================
     ossec.conf - Wazuh Agent Configuration (DMZ)
     Manager: 10.0.3.10 (Wazuh-Manager on Monitoring segment)
     Protocol: TCP (encrypted)
     ========================================================================= -->
<ossec_config>
  <client>
    <server>
      <address>10.0.3.10</address>
      <protocol>tcp</protocol>
      <port>1514</port>
    </server>
    <config-profile>ubuntu,22.04,pfa-dmz</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
  </client>

  <syscheck>
    <disabled>no</disabled>
    <frequency>3600</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories check_all="yes" realtime="yes">/etc</directories>
    <directories check_all="yes">/var/log</directories>
  </syscheck>

  <rootcheck>
    <disabled>no</disabled>
    <frequency>3600</frequency>
  </rootcheck>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <active-response>
    <disabled>yes</disabled>
  </active-response>
</ossec_config>
