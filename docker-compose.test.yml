# =============================================================================
# docker-compose.test.yml — PFA Test Pipeline (Cisco-less validation)
# =============================================================================
# NOTE: In production, all inter-segment traffic routes through Cisco 3725.
# This compose bypasses Cisco to validate software functionality.
# Wazuh-manager has dual-network attachment for agent communication.
# =============================================================================
networks:
  pfa_dmz:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.1.0/24
          gateway: 10.0.1.254
  pfa_monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.3.0/24
          gateway: 10.0.3.254

volumes:
  suricata_logs:

services:
  # --- DMZ SERVICES ---
  webserver:
    image: pfa-webserver:latest
    container_name: pfa-webserver
    hostname: webserver
    networks:
      pfa_dmz:
        ipv4_address: 10.0.1.10
    ports:
      - "8080:80"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    mem_limit: 256m

  suricata:
    image: pfa-suricata:latest
    container_name: pfa-suricata
    hostname: suricata
    networks:
      pfa_dmz:
        ipv4_address: 10.0.1.100
    cap_add: [NET_ADMIN, NET_RAW, SYS_PTRACE]
    volumes:
      - suricata_logs:/var/log/suricata
    healthcheck:
      test: ["CMD", "pgrep", "-x", "suricata"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    mem_limit: 512m

  zeek:
    image: pfa-zeek:latest
    container_name: pfa-zeek
    hostname: zeek
    networks:
      pfa_dmz:
        ipv4_address: 10.0.1.101
    cap_add: [NET_ADMIN, NET_RAW]
    healthcheck:
      test: ["CMD", "pgrep", "-x", "zeek"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    mem_limit: 512m

  # --- MONITORING SERVICES ---
  wazuh-indexer:
    image: pfa-wazuh-indexer:latest
    container_name: pfa-wazuh-indexer
    hostname: wazuh-indexer
    networks:
      pfa_monitoring:
        ipv4_address: 10.0.3.11
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    healthcheck:
      test: ["CMD", "curl", "-k", "-sf", "https://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    restart: unless-stopped
    mem_limit: 2g

  wazuh-manager:
    image: pfa-wazuh-manager:latest
    container_name: pfa-wazuh-manager
    hostname: wazuh-manager
    networks:
      pfa_dmz:
        ipv4_address: 10.0.1.20
      pfa_monitoring:
        ipv4_address: 10.0.3.10
    ports:
      - "1514:1514/udp"
      - "1515:1515/tcp"
      - "55000:55000/tcp"
    volumes:
      - suricata_logs:/var/log/suricata:ro
    environment:
      WAZUH_ADMIN_PASSWORD: "PFA_Admin_2026"
    healthcheck:
      test: ["CMD", "/var/ossec/bin/wazuh-control", "status"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    mem_limit: 2g
    depends_on:
      wazuh-indexer:
        condition: service_healthy

  wazuh-dashboard:
    image: pfa-wazuh-dashboard:latest
    container_name: pfa-wazuh-dashboard
    hostname: wazuh-dashboard
    networks:
      pfa_monitoring:
        ipv4_address: 10.0.3.12
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: "https://10.0.3.11:9200"
      DASHBOARD_USERNAME: "admin"
      DASHBOARD_PASSWORD: "PFA_Admin_2026"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5601/status"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    mem_limit: 1g
    depends_on:
      wazuh-indexer:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: pfa-prometheus
    hostname: prometheus
    networks:
      pfa_monitoring:
        ipv4_address: 10.0.3.20
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    mem_limit: 256m

  grafana:
    image: pfa-grafana:latest
    container_name: pfa-grafana
    hostname: grafana
    networks:
      pfa_monitoring:
        ipv4_address: 10.0.3.30
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "PFA_Admin_2026"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      - prometheus