! =============================================================================
! PFA-ROUTER ? Cisco 3725 Enterprise Router Configuration
! =============================================================================
! Platform: Cisco 3725 (Dynamips) IOS 12.4(15)T
! Role:     Sole gateway for all PFA network segments
! Architecture:
!   Fa0/0 --- LAN (10.0.2.0/24) --- Kali, PostgreSQL
!   Fa0/1 --- DMZ (10.0.1.0/24) --- Web, Suricata, Zeek
!   Fa1/0 --- Monitoring (10.0.3.0/24) --- Wazuh, Prometheus, Grafana
! Principle: Every packet between segments MUST pass through this router.
! No Docker network may perform routing or NAT.
! =============================================================================
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
service sequence-numbers
no ip domain-lookup
ip domain-name pfa.local
!
hostname PFA-ROUTER
!
enable secret PFA_Router_Enable_2026
!
username admin privilege 15 secret PFA_Admin_2026
username netadmin privilege 5 secret PFA_NetAdmin_2026
username operator privilege 1 secret PFA_Operator_2026
!
! --- Fa0/0 ? LAN Segment (10.0.2.0/24) ---
interface FastEthernet0/0
 description PFA-LAN -- Kali(.100) PostgreSQL(.10)
 ip address 10.0.2.254 255.255.255.0
 ip access-group 100 in
 ip access-group 110 out
 no shutdown
 duplex auto
 speed auto
!
! --- Fa0/1 ? DMZ Segment (10.0.1.0/24) ---
interface FastEthernet0/1
 description PFA-DMZ -- Web(.10) Suricata(.100) Zeek(.101)
 ip address 10.0.1.254 255.255.255.0
 ip access-group 101 in
 ip access-group 110 out
 no shutdown
 duplex auto
 speed auto
!
! --- Fa1/0 ? Monitoring Segment (10.0.3.0/24) ---
interface FastEthernet1/0
 description PFA-MON -- Wazuh(.10-.12) Prom(.20) Graf(.30)
 ip address 10.0.3.254 255.255.255.0
 ip access-group 102 in
 ip access-group 110 out
 no shutdown
 duplex auto
 speed auto
!
! =============================================================================
! ACL 100 ? LAN inbound (applied IN Fa0/0)
! Permit: Kali->Web HTTP/SSH, established, LAN->Monitoring
! Deny+log: all other LAN->DMZ
! =============================================================================
access-list 100 remark === LAN inbound ===
access-list 100 permit tcp host 10.0.2.100 host 10.0.1.10 eq 80
access-list 100 permit tcp host 10.0.2.100 host 10.0.1.10 eq 22
access-list 100 permit icmp host 10.0.2.100 10.0.1.0 0.0.0.255
access-list 100 permit tcp host 10.0.2.10 host 10.0.1.10 eq 80
access-list 100 permit tcp host 10.0.2.100 host 10.0.2.10 eq 5432
access-list 100 permit icmp 10.0.1.0 0.0.0.255 host 10.0.2.100 echo-reply
access-list 100 permit tcp 10.0.2.0 0.0.0.255 10.0.1.0 0.0.0.255 established
access-list 100 permit ip 10.0.2.0 0.0.0.255 10.0.3.0 0.0.0.255
access-list 100 deny   ip 10.0.2.0 0.0.0.255 10.0.1.0 0.0.0.255 log
access-list 100 permit ip any any
!
! =============================================================================
! ACL 101 ? DMZ inbound (applied IN Fa0/1)
! Permit: Suricata->Wazuh syslog, established, DMZ->Monitoring
! DENY+LOG: all new DMZ->LAN (pivot prevention)
! =============================================================================
access-list 101 remark === DMZ inbound ===
access-list 101 permit tcp host 10.0.1.100 host 10.0.3.10 eq 1514
access-list 101 permit udp host 10.0.1.100 host 10.0.3.10 eq 1514
access-list 101 permit tcp host 10.0.1.100 host 10.0.3.20 eq 9091
access-list 101 permit tcp 10.0.1.0 0.0.0.255 10.0.2.0 0.0.0.255 established
access-list 101 permit ip 10.0.1.0 0.0.0.255 10.0.3.0 0.0.0.255
access-list 101 deny   ip 10.0.1.0 0.0.0.255 10.0.2.0 0.0.0.255 log
access-list 101 permit ip any any
!
! =============================================================================
! ACL 102 ? Monitoring inbound (applied IN Fa1/0)
! Permit: established, Monitoring->LAN, specific Monitoring->DMZ (agent, metrics)
! Deny+log: all other Monitoring->DMZ
! =============================================================================
access-list 102 remark === Monitoring inbound ===
access-list 102 permit tcp 10.0.3.0 0.0.0.255 10.0.1.0 0.0.0.255 established
access-list 102 permit ip 10.0.3.0 0.0.0.255 10.0.2.0 0.0.0.255
access-list 102 permit tcp 10.0.3.0 0.0.0.255 host 10.0.1.102 eq 1515
access-list 102 permit tcp host 10.0.3.20 host 10.0.1.100 eq 9091
access-list 102 permit tcp host 10.0.3.30 host 10.0.3.11 eq 9200
access-list 102 permit tcp host 10.0.3.12 host 10.0.3.11 eq 9200
access-list 102 deny   ip 10.0.3.0 0.0.0.255 10.0.1.0 0.0.0.255 log
access-list 102 permit ip any any
!
! --- ACL 110 ? Anti-spoofing outbound (applied OUT all interfaces) ---
access-list 110 remark === Anti-spoofing outbound ===
access-list 110 permit ip 10.0.1.0 0.0.0.255 any
access-list 110 permit ip 10.0.2.0 0.0.0.255 any
access-list 110 permit ip 10.0.3.0 0.0.0.255 any
access-list 110 deny   ip any any log
!
! --- LOGGING ---
logging host 10.0.3.10 transport tcp port 1514
logging trap informational
logging facility local0
logging on
logging buffered 32768
logging console informational
logging monitor informational
!
! --- SSH ---
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh authentication-retries 3
ip ssh time-out 30
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
line console 0
 logging synchronous
 exec-timeout 15 0
!
! --- NTP ---
ntp master 4
ntp update-calendar
!
! --- DISABLE UNUSED ---
no cdp run
no ip http server
no ip http secure-server
!
banner motd ^
************************************************************************
*                                                                      *
*  PFA-ROUTER                                                          *
*  ACCES NON AUTORISE STRICTEMENT INTERDIT                             *
*                                                                      *
************************************************************************
^
!
end
